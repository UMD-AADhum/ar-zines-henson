<!-- include A-Frame obviously -->
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<!-- include ar.js for A-Frame -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>


<body style='margin : 0px; overflow: hidden;'>
  <a-scene embedded arjs='detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>

    <!-- create your content here. -->
  	<a-marker class="animated-marker" type='barcode' value='1'>
        <a-entity gltf-model="#adinkra" position='0 0.5 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='2'>
        <a-entity gltf-model="#quilt" position='0 0.5 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='3'>
        <a-entity gltf-model="#butterflies" position='0 0.1 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='4'>
        <a-entity gltf-model="#turtle" position='0 0.1 0' scale="0.75 0.75 0.75" animation-mixer="clip: Hide"></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='5'>
        <a-entity gltf-model="#robin" position='0 0.1 0' scale="8 8 8" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='6'>
        <a-entity gltf-model="#elephant" position='0 0.5 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='7'>
        <a-entity gltf-model="#toybird" position='0 0.1 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='8'>
        <a-entity gltf-model="#eevee" position='0 0.1 0' scale="0.75 0.75 0.75" animation-mixer></a-entity>
    </a-marker>


    <!-- define a camera which will move according to the marker position -->
    <a-entity camera></a-entity>


    <!-- load assets d -->

    <a-assets>
    	<a-asset-item id="adinkra" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/3d_adinkra_asase-ye-duru_obj/scene.gltf"></a-asset-item>
      <a-asset-item id="quilt" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/cloud_station/scene.gltf"></a-asset-item>
      <a-asset-item id="butterflies" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/butterflies_wooden_toy/scene.gltf"></a-asset-item>
      <a-asset-item id="turtle" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/hide-the-turtle/scene.gltf"></a-asset-item>
      <a-asset-item id="robin" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/lowpoly_bird_robin/scene.gltf"></a-asset-item>
      <a-asset-item id="elephant" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/animated_elephant_character/scene.gltf"></a-asset-item>
      <a-asset-item id="toybird" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/flying_bird_wooden_toy/scene.gltf"></a-asset-item>
      <a-asset-item id="eevee" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-henson/refs/heads/main/assets/pokedex_3d_pro_eevee/scene.gltf"></a-asset-item>
  	</a-assets>
  </a-scene>
</body>
